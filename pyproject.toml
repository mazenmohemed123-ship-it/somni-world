[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "somni-orchestrator"
version = "0.1.0"
description = "SOMNI Living Simulation Kernel — Python orchestration layer"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "black",
    "ruff",
    "mypy",
]

[project.scripts]
somni-api   = "orchestrator.api.server:main"
somni-world = "orchestrator.bootstrap.questioner:main_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
